services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dental_portal}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dental_portal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dental_portal}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dental_portal_postgres:
